<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="주식 브리핑">
<meta name="theme-color" content="#0a0e1a">
<title>📊 나의 주식 대시보드</title>

<!-- ──────────────────────────────────────────
  🔧 구글 시트 연동 설정
  
  Make(make.com) 자동화 완료 후 아래 2줄만 수정하세요:
  
  1. SHEET_ID : 구글 시트 URL에서 /d/XXXXX/edit 사이의 값
  2. SHEET_NAME : 시트 탭 이름 (기본값: Sheet1)
  
  예시:
  const SHEET_ID = "1BxiMVs0XRA5nFMdKvBdBZjgmUUqptlbs74OgVE2upms";
  const SHEET_NAME = "환율";
  
  ※ 시트를 "링크가 있는 모든 사용자" 읽기 권한으로 공개해야 작동합니다.
────────────────────────────────────────── -->

<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;800&family=Bebas+Neue&display=swap');

:root {
  --bg: #0a0e1a;
  --bg2: #111827;
  --bg3: #1a2235;
  --border: rgba(255,255,255,0.07);
  --text: #e8eaf0;
  --muted: #4a6080;
  --faint: #232f42;
  --blue: #4d9fff;
  --blue-bg: rgba(56,139,253,0.12);
  --blue-border: rgba(56,139,253,0.3);
  --green: #2ecc71;
  --red: #ff4d6d;
  --gold: #ffc832;
  --font-size: 1rem;
}
.large-font { --font-size: 1.2rem; }

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  font-family: 'Noto Sans KR', sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: var(--font-size);
  min-height: 100vh;
  max-width: 430px;
  margin: 0 auto;
  position: relative;
  overscroll-behavior: none;
}

/* ── 배경 글로우 ── */
body::before {
  content: '';
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 280px;
  background: radial-gradient(ellipse at 50% -10%, rgba(56,139,253,0.18) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

/* ── 헤더 ── */
#header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(10,14,26,0.96);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 14px 16px 0;
}
.header-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}
.header-label {
  font-size: calc(var(--font-size) * 0.65);
  color: #5a7fa8;
  letter-spacing: 3px;
  text-transform: uppercase;
  font-weight: 600;
  margin-bottom: 2px;
}
.header-title {
  font-size: calc(var(--font-size) * 1.15);
  font-weight: 800;
  letter-spacing: -0.5px;
}
.header-btns { display: flex; gap: 6px; align-items: center; }

/* ── 버튼 공통 ── */
.btn {
  border-radius: 20px;
  padding: 6px 12px;
  font-size: calc(var(--font-size) * 0.75);
  font-weight: 600;
  cursor: pointer;
  border: 1px solid;
  transition: all 0.2s;
  font-family: 'Noto Sans KR', sans-serif;
  white-space: nowrap;
}
.btn-blue {
  background: var(--blue-bg);
  border-color: var(--blue-border);
  color: var(--blue);
}
.btn-font {
  background: rgba(255,255,255,0.07);
  border-color: rgba(255,255,255,0.12);
  color: #8a9ab0;
  display: flex;
  align-items: center;
  gap: 2px;
}
.btn-font.active {
  background: rgba(255,200,50,0.18);
  border-color: rgba(255,200,50,0.5);
  color: var(--gold);
}
.btn-font .f1 { font-size: 11px; }
.btn-font .f2 { font-size: 15px; }

#last-updated {
  font-size: calc(var(--font-size) * 0.7);
  color: var(--muted);
  margin-bottom: 8px;
}

/* ── 탭 ── */
.tabs { display: flex; gap: 4px; }
.tab {
  flex: 1;
  padding: 9px 4px;
  font-size: calc(var(--font-size) * 0.82);
  font-weight: 500;
  cursor: pointer;
  border-radius: 10px 10px 0 0;
  border: 1px solid transparent;
  background: transparent;
  color: var(--muted);
  font-family: 'Noto Sans KR', sans-serif;
  transition: all 0.2s;
}
.tab.active {
  background: var(--blue-bg);
  border-color: rgba(56,139,253,0.45);
  color: var(--blue);
  font-weight: 700;
}

/* ── 컨텐츠 ── */
#content {
  padding: 14px 14px 110px;
  position: relative;
  z-index: 1;
}

.pane { display: none; }
.pane.active { display: block; animation: fadeUp 0.25s ease; }
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── 카드 ── */
.card {
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 14px 15px;
  margin-bottom: 10px;
  cursor: pointer;
  transition: background 0.15s;
}
.card:hover, .card:active { background: rgba(255,255,255,0.065); }

/* ── 뉴스 카드 ── */
.news-chip {
  display: inline-block;
  background: var(--blue-bg);
  color: var(--blue);
  font-size: calc(var(--font-size) * 0.65);
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 6px;
  margin-right: 6px;
}
.news-source { color: var(--muted); font-size: calc(var(--font-size) * 0.7); }
.news-title {
  font-size: calc(var(--font-size) * 0.85);
  font-weight: 600;
  line-height: 1.55;
  color: #c8d4e0;
  margin-top: 5px;
}
.news-time { font-size: calc(var(--font-size) * 0.7); color: var(--muted); margin-top: 5px; }

/* ── AI 브리핑 박스 ── */
.ai-box {
  background: linear-gradient(135deg, rgba(56,139,253,0.1), rgba(88,86,214,0.1));
  border: 1px solid rgba(56,139,253,0.22);
  border-radius: 16px;
  padding: 15px;
  margin-bottom: 14px;
}
.ai-box-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.ai-title { font-size: calc(var(--font-size) * 0.82); font-weight: 700; color: var(--blue); }
.ai-text { font-size: calc(var(--font-size) * 0.82); line-height: 1.75; color: #a8bcd0; }
.ai-placeholder { font-size: calc(var(--font-size) * 0.75); color: var(--muted); font-style: italic; }

/* ── 종목 카드 ── */
.stock-row { display: flex; align-items: center; gap: 10px; }
.stock-info { flex: 1; }
.stock-name {
  font-size: calc(var(--font-size) * 0.88);
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 5px;
  margin-bottom: 2px;
}
.market-badge {
  font-size: calc(var(--font-size) * 0.62);
  color: var(--muted);
  background: rgba(255,255,255,0.06);
  padding: 1px 5px;
  border-radius: 4px;
}
.stock-ticker { font-size: calc(var(--font-size) * 0.75); color: #4a6080; }
.stock-price-box { text-align: right; }
.stock-price { font-size: calc(var(--font-size) * 0.95); font-weight: 800; }
.badge-up, .badge-dn {
  display: inline-block;
  font-size: calc(var(--font-size) * 0.75);
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 6px;
  margin-top: 3px;
}
.badge-up { color: var(--green); background: rgba(46,204,113,0.1); }
.badge-dn { color: var(--red); background: rgba(255,77,109,0.1); }

/* ── 스파크라인 영역 ── */
.spark-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid rgba(255,255,255,0.055);
}
.btn-chart {
  background: var(--blue-bg);
  border: 1px solid var(--blue-border);
  color: var(--blue);
  border-radius: 10px;
  padding: 5px 12px;
  font-size: calc(var(--font-size) * 0.7);
  font-weight: 700;
  cursor: pointer;
  font-family: 'Noto Sans KR', sans-serif;
  white-space: nowrap;
}
.btn-remove {
  background: rgba(255,77,109,0.1);
  border: 1px solid rgba(255,77,109,0.22);
  color: var(--red);
  border-radius: 8px;
  width: 28px; height: 28px;
  font-size: 13px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}

/* ── 검색 ── */
.add-btn {
  width: 100%;
  border-radius: 14px;
  padding: 12px;
  font-size: calc(var(--font-size) * 0.82);
  font-weight: 700;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  font-family: 'Noto Sans KR', sans-serif;
  transition: all 0.2s;
  background: var(--blue-bg);
  border: 1px dashed rgba(56,139,253,0.4);
  color: var(--blue);
  margin-bottom: 12px;
}
.add-btn.full {
  background: rgba(255,255,255,0.03);
  border-color: rgba(255,255,255,0.1);
  color: var(--muted);
  cursor: not-allowed;
}
.search-box {
  background: rgba(10,14,26,0.98);
  border: 1px solid var(--blue-border);
  border-radius: 14px;
  overflow: hidden;
  margin-bottom: 12px;
  display: none;
}
.search-box.open { display: block; }
.search-input {
  width: 100%;
  background: rgba(255,255,255,0.04);
  border: none;
  border-bottom: 1px solid var(--border);
  padding: 13px 15px;
  font-size: calc(var(--font-size) * 0.82);
  color: var(--text);
  outline: none;
  font-family: 'Noto Sans KR', sans-serif;
}
.search-result {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 11px 15px;
  cursor: pointer;
  border-bottom: 1px solid rgba(255,255,255,0.04);
  transition: background 0.15s;
}
.search-result:last-child { border-bottom: none; }
.search-result:hover, .search-result:active { background: rgba(56,139,253,0.12); }
.sr-name { font-size: calc(var(--font-size) * 0.82); font-weight: 600; }
.sr-sub { font-size: calc(var(--font-size) * 0.7); color: var(--muted); }
.sr-plus { color: var(--blue); font-size: 22px; font-weight: 300; }
.search-empty { padding: 14px 15px; font-size: calc(var(--font-size) * 0.82); color: var(--muted); }

/* ── 환율 카드 ── */
.fx-card {
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 16px;
  margin-bottom: 12px;
  cursor: pointer;
  transition: background 0.15s;
}
.fx-card:hover { background: rgba(255,255,255,0.062); }
.fx-top { display: flex; justify-content: space-between; align-items: center; }
.fx-left { display: flex; align-items: center; gap: 12px; }
.fx-flag { font-size: 26px; }
.fx-pair { font-size: calc(var(--font-size) * 0.95); font-weight: 800; }
.fx-sub { font-size: calc(var(--font-size) * 0.7); color: var(--muted); margin-top: 2px; }
.fx-rate { font-size: calc(var(--font-size) * 1.35); font-weight: 800; }
.fx-spark { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.055); }
.fx-hint { font-size: calc(var(--font-size) * 0.7); color: var(--muted); }
.guide-box {
  background: rgba(56,139,253,0.06);
  border: 1px solid rgba(56,139,253,0.16);
  border-radius: 16px;
  padding: 15px;
  margin-top: 4px;
}
.guide-title { font-size: calc(var(--font-size) * 0.82); font-weight: 700; color: var(--blue); margin-bottom: 8px; }
.guide-text { font-size: calc(var(--font-size) * 0.75); color: #5a7fa8; line-height: 1.9; }

/* ── 차트 모달 ── */
#chart-modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.88);
  z-index: 1000;
  align-items: flex-end;
  justify-content: center;
}
#chart-modal.open { display: flex; }
.chart-panel {
  background: #0d1220;
  border-radius: 24px 24px 0 0;
  border: 1px solid rgba(255,255,255,0.1);
  padding: 22px 18px 40px;
  width: 100%;
  max-width: 430px;
  animation: slideUp 0.25s ease;
}
@keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.chart-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; }
.chart-title { font-size: calc(var(--font-size) * 1.15); font-weight: 800; }
.chart-sub { font-size: calc(var(--font-size) * 0.75); color: #4a6080; margin-top: 2px; }
.close-btn {
  background: rgba(255,255,255,0.08);
  border: none;
  color: var(--text);
  border-radius: 50%;
  width: 32px; height: 32px;
  font-size: 16px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.chart-price-row { display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px; }
.chart-price { font-size: calc(var(--font-size) * 1.8); font-weight: 900; }
canvas#main-chart { width: 100%; border-radius: 10px; display: block; }
.chart-stats { display: flex; gap: 8px; margin-top: 14px; }
.stat-box {
  flex: 1;
  background: rgba(255,255,255,0.04);
  border-radius: 12px;
  padding: 10px 8px;
  text-align: center;
}
.stat-label { font-size: calc(var(--font-size) * 0.62); color: var(--muted); margin-bottom: 4px; }
.stat-val { font-size: calc(var(--font-size) * 0.82); font-weight: 800; color: #c8d4e0; }

/* ── 로딩 ── */
#loading {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 300px;
  gap: 14px;
}
.spinner {
  width: 36px; height: 36px;
  border: 3px solid rgba(56,139,253,0.2);
  border-top-color: var(--blue);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-size: calc(var(--font-size) * 0.82); color: var(--muted); }

/* ── 토스트 알림 ── */
#toast {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%) translateY(-60px);
  background: var(--green);
  color: #fff;
  padding: 10px 22px;
  border-radius: 24px;
  font-size: calc(var(--font-size) * 0.82);
  font-weight: 700;
  z-index: 9999;
  white-space: nowrap;
  transition: transform 0.3s ease;
  pointer-events: none;
}
#toast.show { transform: translateX(-50%) translateY(0); }
#toast.error { background: var(--red); }

/* ── 하단 바 ── */
#footer {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 430px;
  background: rgba(10,14,26,0.97);
  backdrop-filter: blur(20px);
  border-top: 1px solid var(--border);
  padding: 10px 20px 24px;
  z-index: 100;
  text-align: center;
}
.footer-text { font-size: calc(var(--font-size) * 0.68); color: var(--muted); }

/* ──────────────────────────────────
   구글 시트 연동 안내 배너
────────────────────────────────── */
.sheet-banner {
  background: rgba(255,200,50,0.07);
  border: 1px solid rgba(255,200,50,0.25);
  border-radius: 12px;
  padding: 12px 14px;
  margin-bottom: 14px;
  font-size: calc(var(--font-size) * 0.75);
  color: #c8a840;
  line-height: 1.7;
}
.sheet-banner strong { color: var(--gold); }
</style>
</head>
<body>

<!-- ──── 헤더 ──── -->
<div id="header">
  <div class="header-row">
    <div>
      <div class="header-label">Market Brief</div>
      <div class="header-title">📊 나의 주식 대시보드</div>
    </div>
    <div class="header-btns">
      <button class="btn btn-font" id="font-btn" onclick="toggleFont()" title="글자 크기 1.2배 확대/축소">
        <span class="f1">가</span><span class="f2">가</span>
      </button>
      <button class="btn btn-blue" onclick="refreshAll()">↻ 새로고침</button>
    </div>
  </div>
  <div id="last-updated">데이터를 불러오는 중...</div>
  <div class="tabs">
    <button class="tab active" onclick="switchTab('news')">📰 뉴스</button>
    <button class="tab" onclick="switchTab('stocks')">📈 종목</button>
    <button class="tab" onclick="switchTab('fx')">💱 환율</button>
  </div>
</div>

<!-- ──── 컨텐츠 ──── -->
<div id="content">
  <div id="loading">
    <div class="spinner"></div>
    <div class="loading-text">데이터 불러오는 중...</div>
  </div>

  <!-- 뉴스 탭 -->
  <div class="pane" id="pane-news"></div>

  <!-- 종목 탭 -->
  <div class="pane" id="pane-stocks"></div>

  <!-- 환율 탭 -->
  <div class="pane" id="pane-fx"></div>
</div>

<!-- ──── 차트 모달 ──── -->
<div id="chart-modal" onclick="closeChart(event)">
  <div class="chart-panel">
    <div class="chart-header">
      <div>
        <div class="chart-title" id="c-title"></div>
        <div class="chart-sub" id="c-sub"></div>
      </div>
      <button class="close-btn" onclick="closeModal()">✕</button>
    </div>
    <div class="chart-price-row">
      <div class="chart-price" id="c-price"></div>
      <div id="c-badge"></div>
    </div>
    <canvas id="main-chart" height="200"></canvas>
    <div class="chart-stats" id="c-stats"></div>
  </div>
</div>

<!-- ──── 토스트 ──── -->
<div id="toast"></div>

<!-- ──── 하단 ──── -->
<div id="footer">
  <div class="footer-text">⚠️ 현재 모의 데이터 사용 중 · 구글 시트 연동 후 실제 데이터로 전환됩니다</div>
</div>

<script>
/* ══════════════════════════════════════════════
   🔧 구글 시트 설정 (Make 연동 후 여기 수정)
   
   SHEET_ID: 구글 시트 URL의 /d/XXXXX/edit 부분
   SHEET_FX_NAME: 환율 시트 탭 이름
   SHEET_NEWS_NAME: 뉴스 시트 탭 이름
   SHEET_STOCKS_NAME: 종목 시트 탭 이름
   
   USE_SHEET_DATA = true 로 바꾸면 실제 시트 데이터 사용
══════════════════════════════════════════════ */
const SHEET_ID         = "14d1GE-87lclc9NumhIZAF0CFmF968dA71N6Klzf3Ymc";
const SHEET_FX_NAME    = "환율";
const SHEET_NEWS_NAME  = "뉴스";
const SHEET_STOCKS_NAME = "주가";
const USE_SHEET_DATA   = false; // true로 바꾸면 구글 시트 연동

/* ══════════════════════════════════════════════
   데이터 상수
══════════════════════════════════════════════ */
const SEARCH_POOL = [
  { id:"069500", name:"KODEX 200",       ticker:"069500", market:"KR", sector:"ETF" },
  { id:"005930", name:"삼성전자",         ticker:"005930", market:"KR", sector:"반도체" },
  { id:"000660", name:"SK하이닉스",       ticker:"000660", market:"KR", sector:"반도체" },
  { id:"042700", name:"한미반도체",       ticker:"042700", market:"KR", sector:"반도체" },
  { id:"035420", name:"NAVER",            ticker:"035420", market:"KR", sector:"IT" },
  { id:"035720", name:"카카오",           ticker:"035720", market:"KR", sector:"IT" },
  { id:"051910", name:"LG화학",           ticker:"051910", market:"KR", sector:"화학" },

/* ══════════════════════════════════════════════
   모의 데이터 생성
══════════════════════════════════════════════ */
function genHistory(base, vol=0.015) {
  let v = base, pts = [];
  for (let i=29;i>=0;i--) {
    v *= 1 + (Math.random()-0.49)*vol;
    const d = new Date(); d.setDate(d.getDate()-i);
    pts.push({ date:`${d.getMonth()+1}/${d.getDate()}`, value:parseFloat(v.toFixed(v>100?0:2)) });
  }
  return pts;
}
function genPrice(ticker) {
  const base = BASE_PRICES[ticker] || 50000;
  const chg = (Math.random()-0.48)*0.04;
  return { price: Math.round(base*(1+chg*0.1)), change: parseFloat((chg*100).toFixed(2)) };
}
function genFX(base_rate) {
  const chg = (Math.random()-0.5)*0.008;
  return { rate: parseFloat((base_rate*(1+chg)).toFixed(2)), change: parseFloat((chg*100).toFixed(2)) };
}
function genNews(name) {
  const tpl = NEWS_TEMPLATES[Math.floor(Math.random()*NEWS_TEMPLATES.length)];
  const src = ["한국경제","매일경제","연합뉴스","조선비즈"][Math.floor(Math.random()*4)];
  return { title: tpl(name), source: src, time: `${Math.floor(Math.random()*8)+1}시간 전` };
}

/* ══════════════════════════════════════════════
   구글 시트 데이터 로드 (USE_SHEET_DATA=true 시)
══════════════════════════════════════════════ */
async function loadSheetData(sheetName) {
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}`;
  const res = await fetch(url);
  const text = await res.text();
  const json = JSON.parse(text.replace(/^[^{]+/, '').replace(/[^}]+$/, ''));
  const cols = json.table.cols.map(c => c.label);
  return json.table.rows.map(r => {
    const obj = {};
    r.c.forEach((cell, i) => { obj[cols[i]] = cell ? cell.v : null; });
    return obj;
  });
}

async function refreshAll() {
  document.getElementById('loading').style.display = 'flex';
  document.querySelectorAll('.pane').forEach(p => p.classList.remove('active'));

  try {
    if (USE_SHEET_DATA && SHEET_ID !== "여기에_시트_ID_입력") {
      // ── 실제 구글 시트 데이터 ──
      const [fxRows, newsRows, stockRows] = await Promise.all([
        loadSheetData(SHEET_FX_NAME),
        loadSheetData(SHEET_NEWS_NAME),
        loadSheetData(SHEET_STOCKS_NAME),
      ]);
      // 환율 처리
      fxData = {};
      fxRows.forEach(r => {
        if (r['통화']) fxData[r['통화']] = { rate: r['환율'], change: r['등락률'] || 0 };
      });
      // 뉴스 처리
      newsData = newsRows.map(r => ({
        stockName: r['종목'] || '',
        title: r['제목'] || '',
        source: r['출처'] || '',
        time: r['날짜'] || '',
      }));
      // 주가 처리
      stockRows.forEach(r => {
        if (r['티커']) stockData[r['티커']] = { price: r['현재가'], change: r['등락률'] || 0 };
      });
      // 히스토리는 모의 데이터 사용
      watchlist.forEach(s => { stockHistory[s.id] = genHistory(BASE_PRICES[s.ticker]||50000); });
      FX_PAIRS.forEach(f => { fxHistory[f.base] = genHistory(f.rate, 0.005); });
    } else {
      // ── 모의 데이터 ──
      watchlist.forEach(s => {
        stockData[s.id]    = genPrice(s.ticker);
        stockHistory[s.id] = genHistory(BASE_PRICES[s.ticker]||50000, 0.018);
      });
      FX_PAIRS.forEach(f => {
        fxData[f.base]    = genFX(f.rate);
        fxHistory[f.base] = genHistory(f.rate, 0.005);
      });
      newsData = [];
      watchlist.forEach(s => {
        const n = Math.floor(Math.random()*2)+1;
        for (let i=0;i<n;i++) newsData.push({ ...genNews(s.name), stockName: s.name, stockId: s.id });
      });
      newsData.sort(()=>Math.random()-0.5);
    }
  } catch(e) {
    console.error(e);
    showToast("데이터 로드 실패. 모의 데이터로 표시합니다.", true);
    watchlist.forEach(s => { stockData[s.id]=genPrice(s.ticker); stockHistory[s.id]=genHistory(BASE_PRICES[s.ticker]||50000); });
    FX_PAIRS.forEach(f => { fxData[f.base]=genFX(f.rate); fxHistory[f.base]=genHistory(f.rate,0.005); });
    newsData=[];
    watchlist.forEach(s => { for(let i=0;i<2;i++) newsData.push({...genNews(s.name),stockName:s.name}); });
  }

  const now = new Date();
  document.getElementById('last-updated').textContent =
    `업데이트: ${now.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}` +
    (USE_SHEET_DATA && SHEET_ID!=="여기에_시트_ID_입력" ? ' · 구글 시트 연동' : ' · 모의 데이터');

  document.getElementById('loading').style.display = 'none';
  renderAll();
  switchTab(currentTab, true);
}

/* ══════════════════════════════════════════════
   스파크라인 SVG
══════════════════════════════════════════════ */
function sparklineSVG(data, color, W, H) {
  const vals = data.map(d=>d.value);
  const mn = Math.min(...vals), mx = Math.max(...vals), rng = mx-mn||1;
  const pts = vals.map((v,i)=>`${(i/(vals.length-1))*W},${H-((v-mn)/rng)*(H-6)-3}`).join(' ');
  return `<polyline fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${pts}"/>`;
}

function openChart(id, name, ticker) {
  const hist = stockHistory[id];
  const d = stockData[id];
  if (!hist) return;
  const up = d && d.change >= 0;
  const color = up ? '#2ecc71' : '#ff4d6d';
  const last = hist[hist.length-1].value;
  const first = hist[0].value;
  const totalChg = ((last-first)/first*100).toFixed(2);

  document.getElementById('c-title').textContent = name;
  document.getElementById('c-sub').textContent = `${ticker} · 최근 30일`;
  document.getElementById('c-price').textContent = last>=1000 ? `₩${Math.round(last).toLocaleString()}` : `$${last}`;
  document.getElementById('c-badge').innerHTML = `<span class="${up?'badge-up':'badge-dn'}">${up?'▲':'▼'} ${Math.abs(totalChg)}% (30일)</span>`;

  chartCurrentHistory = hist;
  chartCurrentColor = color;
  drawChart();

  const vals = hist.map(d=>d.value);
  const max = Math.max(...vals), min = Math.min(...vals);
  document.getElementById('c-stats').innerHTML = `
    <div class="stat-box"><div class="stat-label">30일 최고</div><div class="stat-val">${max>=1000?Math.round(max).toLocaleString():max}</div></div>
    <div class="stat-box"><div class="stat-label">30일 최저</div><div class="stat-val">${min>=1000?Math.round(min).toLocaleString():min}</div></div>
    <div class="stat-box"><div class="stat-label">변동폭</div><div class="stat-val">${(((max-min)/min)*100).toFixed(1)}%</div></div>`;

  document.getElementById('chart-modal').classList.add('open');
}

function openChartFX(base, pair) {
  const hist = fxHistory[base];
  const d = fxData[base];
  if (!hist) return;

  const color = up ? '#ff4d6d' : '#2ecc71';

  document.getElementById('chart-modal').classList.add('open');
}

function drawChart() {
  const canvas = document.getElementById('main-chart');
  const ctx = canvas.getContext('2d');
  const W = canvas.offsetWidth || 380;
  canvas.width = W * window.devicePixelRatio;
  canvas.height = 200 * window.devicePixelRatio;
  ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
  const CW = W, CH = 200;
  const pad = { top:20, right:16, bottom:40, left:60 };
  const hist = chartCurrentHistory;
  const color = chartCurrentColor;
  const vals = hist.map(d=>d.value);
  const minV = Math.min(...vals), maxV = Math.max(...vals), rng = maxV-minV||1;
  const cw = CW-pad.left-pad.right, ch = CH-pad.top-pad.bottom;

  ctx.clearRect(0,0,CW,CH);

  // 그리드
  for(let i=0;i<=4;i++){
    const y = pad.top+((4-i)/4)*ch;
    const v = minV+(i/4)*rng;
    ctx.strokeStyle='rgba(255,255,255,0.07)'; ctx.lineWidth=1;
    ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.moveTo(pad.left,y); ctx.lineTo(CW-pad.right,y); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='#4a6080';
    ctx.font=`11px 'Noto Sans KR',sans-serif`;
    ctx.textAlign='right';
    ctx.fillText(v>=1000?Math.round(v).toLocaleString():v.toFixed(2), pad.left-6, y+4);
  }

  // X 레이블
  hist.forEach((d,i)=>{
    if(i%5!==0&&i!==hist.length-1) return;
    const x = pad.left+(i/(hist.length-1))*cw;
    ctx.fillStyle='#4a6080'; ctx.font=`10px sans-serif`; ctx.textAlign='center';
    ctx.fillText(d.date, x, CH-pad.bottom+16);
  });

  // 그라데이션 면적
  const grad = ctx.createLinearGradient(0,pad.top,0,CH-pad.bottom);
  grad.addColorStop(0, color+'55'); grad.addColorStop(1, color+'00');
  ctx.beginPath();
  hist.forEach((d,i)=>{
    const x=pad.left+(i/(hist.length-1))*cw, y=pad.top+((maxV-d.value)/rng)*ch;
    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  });
  ctx.lineTo(pad.left+cw,pad.top+ch); ctx.lineTo(pad.left,pad.top+ch); ctx.closePath();
  ctx.fillStyle=grad; ctx.fill();

  // 라인
  ctx.beginPath(); ctx.strokeStyle=color; ctx.lineWidth=2.5; ctx.lineJoin='round';
  hist.forEach((d,i)=>{
    const x=pad.left+(i/(hist.length-1))*cw, y=pad.top+((maxV-d.value)/rng)*ch;
    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  });
  ctx.stroke();

  // 마지막 점
  const lx=pad.left+cw, lv=vals[vals.length-1];
  const ly=pad.top+((maxV-lv)/rng)*ch;
  ctx.beginPath(); ctx.arc(lx,ly,8,0,Math.PI*2); ctx.fillStyle=color+'33'; ctx.fill();
  ctx.beginPath(); ctx.arc(lx,ly,4,0,Math.PI*2); ctx.fillStyle=color; ctx.fill();
}

    t.classList.toggle('active', tabs[i]===tab);
  });
  document.querySelectorAll('.pane').forEach(p=>p.classList.remove('active'));
  const p = document.getElementById('pane-'+tab);
  if(p) p.classList.add('active');
}

/* ══════════════════════════════════════════════
   종목 추가/삭제/검색
══════════════════════════════════════════════ */
function toggleSearch() {
  if(watchlist.length>=10) return;
  showSearch = !showSearch;
  renderStocks();
  if(showSearch) setTimeout(()=>document.getElementById('search-input')?.focus(),50);
}

function handleSearch(q) {
  searchQ = q;
  renderSearchResults();
}

function renderSearchResults() {
  const el = document.getElementById('search-results');
  if(!el) return;
  const q = searchQ.toLowerCase().trim();
  if(!q) { el.innerHTML=''; return; }
  const res = SEARCH_POOL.filter(s=>
    !watchlist.find(w=>w.id===s.id) &&
    (s.name.toLowerCase().includes(q)||s.ticker.toLowerCase().includes(q)||(s.sector||'').toLowerCase().includes(q))
  ).slice(0,6);
  if(!res.length) { el.innerHTML=`<div class="search-empty">검색 결과가 없습니다</div>`; return; }
  el.innerHTML = res.map(s=>`
    <div class="search-result" onclick="addStock('${s.id}','${s.name}','${s.ticker}','${s.market}')">
      <div>
        <div class="sr-name">${s.name}</div>
        <div class="sr-sub">${s.ticker} · ${s.market} · ${s.sector}</div>
      </div>
      <span class="sr-plus">+</span>
    </div>`).join('');
}

function addStock(id, name, ticker, market) {
  if(watchlist.length>=10){ showToast('최대 10개 종목까지 추가할 수 있습니다.', true); return; }
  watchlist.push({id,name,ticker,market});
  stockData[id] = genPrice(ticker);
  stockHistory[id] = genHistory(BASE_PRICES[ticker]||50000);
  const n = Math.floor(Math.random()*2)+1;
  for(let i=0;i<n;i++) newsData.push({...genNews(name),stockName:name,stockId:id});
  searchQ=''; showSearch=false;
  renderAll(); switchTab(currentTab,true);
  showToast(`${name} 추가되었습니다.`);
}

function removeStock(id) {
  watchlist = watchlist.filter(s=>s.id!==id);
  newsData = newsData.filter(n=>n.stockId!==id);
  renderAll(); switchTab(currentTab,true);
}

/* ══════════════════════════════════════════════
   AI 브리핑
══════════════════════════════════════════════ */
async function getAISummary() {
  const el = document.getElementById('ai-text');
  if(!el) return;
  el.className='ai-placeholder';
  el.textContent='브리핑 생성 중...';
  const stockSummary = watchlist.map(s=>{ const d=stockData[s.id]; return d?`${s.name}: ${d.change>0?'+':''}${d.change}%`:s.name; }).join(', ');
  const fxSummary = FX_PAIRS.map(f=>{ const d=fxData[f.base]; return d?`${f.pair}: ${d.rate}원`:f.pair; }).join(', ');
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        model:'claude-haiku-4-5-20251001', max_tokens:600,
        system:'당신은 전문 주식/환율 시장 애널리스트입니다. 3~4문장으로 오늘의 시장 브리핑을 간결하게 한국어로 작성하세요.',
        messages:[{role:'user',content:`종목: ${stockSummary}\n환율: ${fxSummary}\n\n오늘의 시장 브리핑을 작성해주세요.`}]
      })
    });
    const data = await res.json();
    el.className='ai-text';
    el.textContent = data.content?.[0]?.text || '요약을 불러오지 못했습니다.';
  } catch {
    el.textContent='AI 요약을 불러오지 못했습니다.';
  }
}

function showToast(msg, isError=false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = isError ? 'error show' : 'show';
  setTimeout(()=>t.classList.remove('show'), 3000);
}
